# slf4j-simple settings for the replayer and verifier. Logs go to stderr; reports go to stdout.
# Kafka clients log every configuration value at INFO, which buries the replay's progress lines.
org.slf4j.simpleLogger.log.org.apache.kafka=warn
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
