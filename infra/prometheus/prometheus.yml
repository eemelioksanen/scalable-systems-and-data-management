global:
  scrape_interval: 5s

scrape_configs:
  # Docker DNS returns one A record per container, so scaled TaskManagers are
  # discovered automatically.
  - job_name: flink
    dns_sd_configs:
      - names: [jobmanager, taskmanager]
        type: A
        port: 9249
        refresh_interval: 10s

  - job_name: kafka
    static_configs:
      - targets: ["kafka:9404"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
