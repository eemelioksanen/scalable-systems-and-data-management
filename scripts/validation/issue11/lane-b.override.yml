# Lane b of #11: every service pinned to cores 4-7,12-15 (4 physical cores and their SMT siblings).
services:
  kafka:
    cpuset: "4-7,12-15"
  kafka-init:
    cpuset: "4-7,12-15"
  jobmanager:
    cpuset: "4-7,12-15"
  taskmanager:
    cpuset: "4-7,12-15"
  producer:
    cpuset: "4-7,12-15"
  viz:
    cpuset: "4-7,12-15"
  prometheus:
    cpuset: "4-7,12-15"
    volumes: !override
      - ./scripts/validation/issue11/prometheus-lane-b.yml:/etc/prometheus/prometheus.yml:ro
  cadvisor:
    cpuset: "4-7,12-15"
