# Lane a of #11: every service pinned to cores 0-3,8-11 (4 physical cores and their SMT siblings).
services:
  kafka:
    cpuset: "0-3,8-11"
  kafka-init:
    cpuset: "0-3,8-11"
  jobmanager:
    cpuset: "0-3,8-11"
  taskmanager:
    cpuset: "0-3,8-11"
  producer:
    cpuset: "0-3,8-11"
  viz:
    cpuset: "0-3,8-11"
  prometheus:
    cpuset: "0-3,8-11"
    volumes: !override
      - ./scripts/validation/issue11/prometheus-lane-a.yml:/etc/prometheus/prometheus.yml:ro
  cadvisor:
    cpuset: "0-3,8-11"
