# infra/prometheus/prometheus.yml, plus a filter that keeps only this lane's containers and the host's root
# cgroup: cAdvisor sees every container on the host, including the other lane's.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: flink
    dns_sd_configs:
      - names: [jobmanager, taskmanager]
        type: A
        port: 9249
        refresh_interval: 10s

  - job_name: kafka
    static_configs:
      - targets: ["kafka:9404"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_project, id]
        regex: "issue11-lane-a;.*|;/"
        action: keep
