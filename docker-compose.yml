name: trading-trends

x-flink-env: &flink-env
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: jobmanager
    taskmanager.numberOfTaskSlots: ${TM_SLOTS:-2}
    parallelism.default: ${PARALLELISM:-2}
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: 9249

x-flink-build: &flink-build
  context: .
  target: flink-job

services:
  kafka:
    build:
      context: .
      target: kafka
    image: ${COMPOSE_PROJECT_NAME}/kafka:dev
    # The image exports arguments as environment for the broker alone. In `environment`, KAFKA_OPTS would also
    # start the agent in every kafka-*.sh tool, which then fails on the taken port.
    command:
      - /etc/kafka/docker/run
      - KAFKA_OPTS=-javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent.jar=9404:/etc/jmx-exporter/kafka.yml
    volumes:
      - ./infra/kafka/jmx-exporter.yml:/etc/jmx-exporter/kafka.yml:ro
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    # Topic data lives in the container and is wiped by `docker compose down`.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        create="/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists"
        # No time-based retention: a preloaded week must outlive the default 7 days (docs/replayer.md).
        $$create --topic ticks --partitions ${TICKS_PARTITIONS:-8} --config retention.ms=-1
        $$create --topic ema-results --partitions ${TICKS_PARTITIONS:-8}
        $$create --topic advisories --partitions ${TICKS_PARTITIONS:-8}
        $$create --topic late-ticks --partitions ${TICKS_PARTITIONS:-8}
        $$create --topic stats --partitions 1
        $$create --topic subscriptions --partitions 1 --config cleanup.policy=compact
    restart: "no"

  jobmanager:
    build: *flink-build
    image: ${COMPOSE_PROJECT_NAME}/flink-job:dev
    command: jobmanager
    ports:
      - "${FLINK_HOST_PORT:-8081}:8081"
    environment: *flink-env

  taskmanager:
    build: *flink-build
    image: ${COMPOSE_PROJECT_NAME}/flink-job:dev
    command: taskmanager
    depends_on:
      - jobmanager
    environment: *flink-env

  producer:
    build:
      context: .
      target: producer
    image: ${COMPOSE_PROJECT_NAME}/producer:dev
    profiles: ["tools"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./data:/data:ro

  viz:
    build:
      context: .
      target: viz
    image: ${COMPOSE_PROJECT_NAME}/viz:dev
    ports:
      - "${VIZ_HOST_PORT:-8088}:8088"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
    # Must match the job's --zone-offset (D-3).
    command: ["--zone-offset", "+02:00"]

  prometheus:
    image: prom/prometheus:v3.11.2
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # Per-container and host CPU, memory and network. It reads the Docker host's root filesystem and every
  # container's cgroup, so it runs privileged in the host's cgroup namespace.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    privileged: true
    cgroup: host
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --enable_metrics=cpu,memory,network
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
