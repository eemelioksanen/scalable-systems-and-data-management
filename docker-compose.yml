# Local development stack.
#   docker compose up -d --build                     # Kafka, Flink (1 TM), Prometheus, Grafana
#   docker compose up -d --scale taskmanager=4       # more TaskManagers
#   docker compose run --rm producer <MainClass> …   # replayer (profile "tools")
#
# UIs: Flink http://localhost:8081 · Prometheus http://localhost:9090 · Grafana http://localhost:3000
# Kafka from the host: localhost:29092 (inside the network: kafka:9092)
name: trading-trends

x-flink-env: &flink-env
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: jobmanager
    taskmanager.numberOfTaskSlots: ${TM_SLOTS:-2}
    parallelism.default: ${PARALLELISM:-2}
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: 9249

x-flink-build: &flink-build
  context: .
  target: flink-job

services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    # Topic data lives in the container and is wiped by `docker compose down`.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        create="/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists"
        $$create --topic ticks --partitions ${TICKS_PARTITIONS:-8}
        $$create --topic ema-results --partitions ${TICKS_PARTITIONS:-8}
        $$create --topic advisories --partitions ${TICKS_PARTITIONS:-8}
        $$create --topic stats --partitions 1
        $$create --topic subscriptions --partitions 1 --config cleanup.policy=compact
    restart: "no"

  jobmanager:
    build: *flink-build
    image: trading-trends/flink-job:dev
    command: jobmanager
    ports:
      - "8081:8081"
    environment: *flink-env

  taskmanager:
    build: *flink-build
    image: trading-trends/flink-job:dev
    command: taskmanager
    depends_on:
      - jobmanager
    environment: *flink-env

  producer:
    build:
      context: .
      target: producer
    image: trading-trends/producer:dev
    profiles: ["tools"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./data:/data:ro

  prometheus:
    image: prom/prometheus:v3.11.2
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.2
    ports:
      - "3000:3000"
    environment:
      # Local development only: no login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
